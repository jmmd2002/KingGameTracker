<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>King Tracker</title>
  <meta name="theme-color" content="#123d2a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23123d2a'/%3E%3Cpath d='M7 23h18l-1.6-11-4.7 4.2L16 8l-2.7 8.2L8.6 12z' fill='%23d9b45a'/%3E%3C/svg%3E">
  <script>
    try {
      const t = localStorage.getItem("king-tracker:theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="topbar">
        <a class="brand" href="/">
          <svg class="crown" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25h22l-2-14-5.6 5L16 6l-3.4 10L7 11z"/><circle cx="16" cy="5" r="1.8"/><circle cx="6.5" cy="10" r="1.6"/><circle cx="25.5" cy="10" r="1.6"/></svg>
          <span class="brand-name">King</span><span class="brand-sub">Tracker</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a class="nav-item active" href="/" aria-current="page">Players</a>
        </nav>
        <button id="theme-btn" class="btn hero-btn icon-btn" type="button"></button>
      </div>

      <div class="page-head">
        <div>
          <p class="eyebrow">The table</p>
          <h1>Players</h1>
          <p class="lede">Everyone who sits down to play, and how they fare in every round.</p>
        </div>
        <button id="new-btn" class="btn gold" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
          New player
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section id="kpis" class="kpis" aria-label="Summary"></section>

    <section class="panel" aria-label="Player list">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l3.5 3.5"/></svg>
          <input id="search" type="search" placeholder="Search players" aria-label="Search players" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </div>
        <div class="segmented" role="group" aria-label="Show players">
          <button type="button" data-filter="active" aria-pressed="true">Active</button>
          <button type="button" data-filter="archived" aria-pressed="false">Removed</button>
          <button type="button" data-filter="all" aria-pressed="false">All</button>
        </div>
        <div class="sort-control">
          <label for="sort-select">Sort</label>
          <select id="sort-select"></select>
          <button id="sort-dir" class="btn icon-btn" type="button"></button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="grid" id="grid">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <ul class="cards" id="cards"></ul>
      <div class="panel-foot" id="foot"></div>
    </section>
  </main>

  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" inert></aside>

  <dialog id="new-dialog" class="modal">
    <form method="dialog" id="new-form" autocomplete="off">
      <h2>New player</h2>
      <label class="field">
        <span>Name</span>
        <input id="new-name" name="name" maxlength="40" required placeholder="e.g. Ana Costa">
      </label>
      <p class="field-error" id="new-error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Add player</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="modal">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body" class="muted"></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn danger" id="confirm-ok" value="confirm">Remove</button>
      </div>
    </form>
  </dialog>

  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
